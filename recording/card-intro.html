<!DOCTYPE html><html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:720px;background:#0a0b10;color:#eef1f7;font-family:'JetBrains Mono',monospace;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}
.aura{position:absolute;border-radius:50%;filter:blur(110px)}
.a1{width:560px;height:560px;top:-160px;left:-100px;background:radial-gradient(circle,rgba(124,108,255,.5),transparent 70%)}
.a2{width:480px;height:480px;bottom:-160px;right:-100px;background:radial-gradient(circle,rgba(255,93,93,.32),transparent 70%)}
.ghost{position:absolute;font-size:300px;opacity:.12;filter:blur(2px)}
.c{position:relative;z-index:3;text-align:center}
.kick{font-size:20px;letter-spacing:.2em;text-transform:uppercase;color:#7c6cff}
h1{font-family:'Fraunces',serif;font-weight:700;font-size:96px;letter-spacing:-.02em;margin:12px 0}
.by{font-size:20px;color:#9aa3b8;letter-spacing:.12em}
</style></head>
<body>
<div class="aura a1"></div><div class="aura a2"></div>
<div class="ghost">👻</div>
<div class="c">
  <div class="kick" id="k">Ghost in the Machine · Hacktoberfest 2026</div>
  <h1 id="t">Subscription Ghost</h1>
  <div class="by" id="b">built by Sarvar Nadaf</div>
</div>
<script>
gsap.set("#k,#t,#b",{opacity:0,y:20});
gsap.timeline()
 .to("#k",{opacity:1,y:0,duration:.6,ease:"power3.out"})
 .to("#t",{opacity:1,y:0,duration:.8,ease:"power3.out"},"-=.2")
 .to("#b",{opacity:1,y:0,duration:.6,ease:"power3.out"},"-=.3");
</script>
</body></html>
