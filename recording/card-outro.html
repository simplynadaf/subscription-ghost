<!DOCTYPE html><html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:720px;background:#0a0b10;color:#eef1f7;font-family:'JetBrains Mono',monospace;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}
.aura{position:absolute;border-radius:50%;filter:blur(110px)}
.a1{width:520px;height:520px;top:-150px;right:-90px;background:radial-gradient(circle,rgba(124,108,255,.5),transparent 70%)}
.a2{width:460px;height:460px;bottom:-150px;left:-90px;background:radial-gradient(circle,rgba(54,211,153,.26),transparent 70%)}
.ghost{position:absolute;right:60px;top:50%;transform:translateY(-50%);font-size:280px;opacity:.1;filter:blur(2px)}
.c{position:relative;z-index:3;text-align:center;max-width:980px}
h1{font-family:'Fraunces',serif;font-weight:700;font-size:64px;letter-spacing:-.02em;margin-bottom:8px}
.sub{font-size:20px;color:#9aa3b8;letter-spacing:.06em;margin-bottom:34px}
.links{display:flex;flex-direction:column;gap:10px;align-items:center;font-size:21px;letter-spacing:.06em}
.links .live{color:#7c6cff}.links .repo{color:#36d399}
.cta{margin-top:30px;font-family:'Fraunces',serif;font-weight:700;font-size:40px;letter-spacing:.04em}
.cta b{color:#ff8a3d}
.socials{margin-top:26px;font-size:16px;color:#9aa3b8;letter-spacing:.08em}
</style></head>
<body>
<div class="aura a1"></div><div class="aura a2"></div>
<div class="ghost">👻</div>
<div class="c">
  <h1 id="t">Subscription Ghost</h1>
  <div class="sub" id="s">Find the money quietly leaving your account.</div>
  <div class="links" id="l">
    <div class="live">🖥  simplynadaf.github.io/subscription-ghost</div>
    <div class="repo">⭐  github.com/simplynadaf/subscription-ghost</div>
  </div>
  <div class="cta" id="c"><b>Like</b> · <b>Comment</b> · <b>Share</b></div>
  <div class="socials" id="so">sarvarnadaf.com · Dev.to @sarvar_04 · YouTube @sarvar-nadaf · LinkedIn in/sarvar04 · X @SarvarN_04</div>
</div>
<script>
gsap.set("#t,#s,#l,#c,#so",{opacity:0,y:18});
gsap.timeline()
 .to("#t",{opacity:1,y:0,duration:.7,ease:"power3.out"})
 .to("#s",{opacity:1,y:0,duration:.6},"-=.3")
 .to("#l",{opacity:1,y:0,duration:.6},"-=.2")
 .to("#c",{opacity:1,y:0,duration:.6,ease:"back.out(1.5)"},"-=.1")
 .to("#so",{opacity:1,y:0,duration:.6},"-=.2");
</script>
</body></html>
